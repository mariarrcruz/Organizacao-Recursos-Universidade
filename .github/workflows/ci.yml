name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo: o SonarCloud calcula "novo código" e blame

      - name: Set up JDK 21 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (./mvnw -B verify)
        run: ./mvnw -B verify

      - name: SonarCloud analysis (plugin Maven)
        # Não roda em PR vindo de fork (sem acesso ao secret). O token vai só pela variável de ambiente.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Roda depois do verify, que já gerou target/classes, target/test-classes e target/site/jacoco/jacoco.xml.
        # SONAR_HOST_URL aponta para um SonarQube próprio; sem a variável, usa o SonarCloud.
        # Um SonarQube em localhost não é alcançável pelos runners hospedados do GitHub: nesse caso
        # o job precisa rodar em self-hosted runner dentro da mesma rede.
        run: >-
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-failsafe-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn
