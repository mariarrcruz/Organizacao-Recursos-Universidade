server.port=8080
app.banco.url=jdbc:postgresql://localhost:5432/organizacao
app.banco.usuario=organizacao
app.banco.senha=organizacao
# Só para laboratório/JMeter: habilita POST /dev/tokens. Manter false fora do laboratório.
app.dev.tokens=false
# Primeiro administrador: definido por variável de ambiente, sem senha no repositório. Só é semeado se
# ainda não existir nenhum administrador.
app.bootstrap.admin.id=${APP_BOOTSTRAP_ADMIN_ID:admin}
app.bootstrap.admin.senha=${APP_BOOTSTRAP_ADMIN_SENHA:}
